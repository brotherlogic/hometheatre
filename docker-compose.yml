name: hometheatre

services:
  hometheatre:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hometheatre
    restart: unless-stopped
    devices:
      - "${OPTICAL_SR_DEVICE:-/dev/sr0}:/dev/sr0"
      - "${OPTICAL_SG_DEVICE:-/dev/sg0}:${OPTICAL_SG_DEVICE:-/dev/sg0}"
    group_add:
      - "${CDROM_GID:-24}"
    cap_add:
      - SYS_RAWIO
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      - OPTICAL_DEVICE=/dev/sr0
      - SCRATCH_DIR=/scratch
      - NFS_ROOT=/mnt/nfs
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TMDB_API_KEY=${TMDB_API_KEY}
      - WEBHOOK_URL=${WEBHOOK_URL:-}
      - DVDCSS_METHOD=key
      - DVDCSS_CACHE=/scratch/.dvdcss
      - DVDCSS_VERBOSE=1
    volumes:
      - "${SCRATCH_DIR}:/scratch"
      - nfs_media:/mnt/nfs

volumes:
  nfs_media:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${NFS_SERVER_IP},${NFS_OPTS}"
      device: ":${NFS_PATH}"
